[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "space-tape"
version = "0.1.0"
description = "Open-source X Spaces transcription. Whisper is the ear. Hydra is the speaker list."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "space-tape contributors" },
]
keywords = [
  "x",
  "twitter",
  "spaces",
  "transcription",
  "whisper",
  "hydra",
  "asr",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
dependencies = [
  "yt-dlp>=2024.8.0",
  "huggingface-hub>=0.23.0",
  "transformers>=4.40.0",
  "torch>=2.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
space-tape = "space_tape.cli:main"
space_tape = "space_tape.cli:main"

[project.urls]
Homepage = "https://github.com/hovtgc/x-spaces-transcription"
Repository = "https://github.com/hovtgc/x-spaces-transcription"
Issues = "https://github.com/hovtgc/x-spaces-transcription/issues"

[tool.setuptools.packages.find]
include = ["space_tape*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
